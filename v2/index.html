<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A0–A2 French course with audio, katakana and IPA pronunciation, and situational usage notes for Japanese speakers.">
<meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Français">
<title>Français A0–A2</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
</head>
<body>

<!-- ---------- mobile header ---------- -->
<header class="header">
  <button class="icon-btn" id="menuBtn" aria-label="目次を開く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <span class="header__title" id="headerTitle">Français</span>
  <button class="icon-btn" data-open-search aria-label="検索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <button class="icon-btn" data-open-cards aria-label="フラッシュカード">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="15" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg>
  </button>
</header>

<!-- ---------- sidebar ---------- -->
<nav class="nav" id="nav">
  <div class="nav__head">
    <div class="nav__brand">Français <span>A0 → A2</span></div>
    <div class="nav__progress">
      <span class="bar"><i id="progFill" style="width:0%"></i></span>
      <span id="progText">0/33</span>
    </div>
  </div>
  <div class="nav__list" id="navList"></div>
  <div class="nav__foot">
    <button class="btn btn--sm btn--grow" data-open-search>検索</button>
    <button class="btn btn--sm btn--grow" data-open-cards>カード</button>
    <button class="btn btn--sm" data-open-settings aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</nav>
<div class="backdrop" id="backdrop"></div>

<!-- ---------- content ---------- -->
<div class="app">
  <main class="main" id="mainWrap">
    <div class="voicewarn" id="voiceWarn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span id="voiceWarnText"></span>
    </div>
    <div id="main"></div>
  </main>
</div>

<!-- ---------- search ---------- -->
<div class="sheet" id="searchSheet">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h3>検索</h3>
      <button class="icon-btn" data-close-sheet aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet__body">
      <input class="search-input" id="searchInput" type="search" placeholder="bonjour / hello / こんにちは" autocomplete="off">
      <div id="searchResults" style="margin-top:1rem"></div>
    </div>
  </div>
</div>

<!-- ---------- flashcards ---------- -->
<div class="sheet" id="fcSheet">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h3>フラッシュカード</h3>
      <button class="icon-btn" data-close-sheet aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="fcBody"></div>
  </div>
</div>

<!-- ---------- settings ---------- -->
<div class="sheet" id="settingsSheet">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h3>設定</h3>
      <button class="icon-btn" data-close-sheet aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="settingsBody"></div>
  </div>
</div>

<!-- ---------- engine ---------- -->
<script src="js/phonemes.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/phonetics.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>

<!-- ---------- content ---------- -->
<script src="data/curriculum.js"></script>

<script src="js/app.js"></script>
</body>
</html>
